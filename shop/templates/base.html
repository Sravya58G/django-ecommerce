{% load static %}
<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShopEase</title><link rel="stylesheet" href="{% static 'style.css' %}">
<script defer src="{% static 'app.js' %}"></script></head>
<body><header><a class="logo" href="/">ShopEase</a><nav>
<a href="/">Shop</a><a href="/cart/">Cart</a>
{% if user.is_authenticated %}
<a href="/orders/">My orders</a>
<form class="inline" method="post" action="/logout/">{% csrf_token %}<button>Logout</button></form>
{% else %}<a href="/login/">Login</a><a href="/register/">Register</a>{% endif %}
</nav></header><main class="wrap">
{% for message in messages %}<p class="notice">{{ message }}</p>{% endfor %}
{% block content %}{% endblock %}</main><footer>ShopEase | Django demo store</footer></body></html>
